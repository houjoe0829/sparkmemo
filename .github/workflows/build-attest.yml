name: Build and attest release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example 0.2.10
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] || exit 1
      - name: Check out the exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source and styles
        run: npx --no-install eslint src --max-warnings=0 && node scripts/check-css.cjs
      - name: Run regression tests serially
        run: node --test --test-concurrency=1 scripts/*.test.cjs scripts/test-settings.cjs
      - name: Build
        run: npm run build
      - name: Package validated assets
        run: node scripts/package-release.cjs "$RELEASE_TAG" "$RUNNER_TEMP/spark-memo-release"
      - name: Attest the exact packaged files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/spark-memo-release/*
      - name: Save attested assets for the separately approved release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spark-memo-${{ inputs.tag }}
          path: ${{ runner.temp }}/spark-memo-release/*
          if-no-files-found: error
